name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check transcribe.py runtime.py tests
      - name: Check formatting
        run: python -m ruff format --check transcribe.py runtime.py tests
      - name: Test without GPU or model downloads
        run: python -m unittest discover -s tests -v
